{% extends 'base.html' %}{% block title %}Sign in | NutriWell{% endblock %}{% block content %}<section class="form-wrap narrow"><div class="form-heading"><span class="eyebrow">WELCOME BACK</span><h1>Sign in to NutriWell</h1><p>Your routine is waiting for you.</p></div><form method="post" class="form-card"><label>Mobile number<input name="mobile" required inputmode="numeric" pattern="[0-9]{10}" maxlength="10" autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="button full-button" type="submit">Sign in</button></form><p class="center">New to NutriWell? <a href="{{ url_for('signup') }}">Create an account</a></p></section>{% endblock %}
