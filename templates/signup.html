{% extends 'base.html' %}{% block title %}Create account | NutriWell{% endblock %}{% block content %}<section class="form-wrap"><div class="form-heading"><span class="eyebrow">LET'S GET STARTED</span><h1>Create your account</h1><p>Tell us a little about your routine and preferences.</p></div><form method="post" class="form-card"><div class="form-grid"><label>Username<input name="username" required maxlength="80" autocomplete="username"></label><label>Mobile number<input name="mobile" required inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit number"></label><label>Age (18–60)<input type="number" name="age" required min="18" max="60"></label><label>Current weight (kg)<input type="number" name="weight" required min="1" max="350" step="0.1"></label><label>Profession<select name="profession" required><option value="student">Student</option><option value="housewife">Housewife / homemaker</option><option value="employee">Employee</option></select></label><label>Health goal<select name="goal" id="goal" required><option value="weight_loss">Weight loss</option><option value="weight_gain">Weight gain</option><option value="maintain">Maintain weight</option></select></label><label id="target-wrap">Target change (kg)<select name="target_kg" id="target">{% for n in range(1,11) %}<option value="{{ n }}">{{ n }} kg</option>{% endfor %}</select></label><label>Food preference<select name="food" required><option value="veg">Vegetarian</option><option value="nonveg">Non-vegetarian</option><option value="eggen">Eggs only (plus suitable vegetarian foods)</option><option value="both">Vegetarian and non-vegetarian</option></select></label><label>Weekly flexible-meal day<select name="flexible_day" required><option>Sunday</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select><small>Choose one day for a flexible meal. Health-related restrictions still apply.</small></label><label class="full">Health condition<select name="condition"><option value="none">No known condition</option><option value="lung">Asthma / lung-related condition</option><option value="diabetes">Diabetes</option><option value="bp">High blood pressure</option><option value="thyroid">Thyroid condition</option><option value="heart">Heart-related condition</option><option value="joint">Joint or back problem</option><option value="other">Other / multiple conditions</option></select><small>NutriWell provides general examples and safety notes, not treatment plans. For a medical condition, confirm diet and exercise changes with your clinician.</small></label><label class="full">Password (at least 8 characters)<input type="password" name="password" required minlength="8" autocomplete="new-password"></label></div><button class="button full-button" type="submit">Create my account</button><p class="small">By continuing, you acknowledge the <a href="{{ url_for('disclaimer') }}">health disclaimer</a>.</p></form><p class="center">Already registered? <a href="{{ url_for('signin') }}">Sign in</a></p></section><script>const goal=document.getElementById('goal'), wrap=document.getElementById('target-wrap'), target=document.getElementById('target');function syncGoal(){const maintain=goal.value==='maintain';wrap.style.display=maintain?'none':'block';target.disabled=maintain;}goal.addEventListener('change',syncGoal);syncGoal();</script>{% endblock %}
